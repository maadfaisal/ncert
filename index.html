// ============================================================================
// APP ENGINE LOGIC
// ============================================================================

let currentIdx = 0;
let userAnswers = new Array(quizData.length).fill(null);
let score = 0;
let timerSeconds = 5400; // 90 mins
let timerInterval = null;

function initQuiz() {
  currentIdx = 0;
  score = 0;
  userAnswers.fill(null);
  showQuestion(currentIdx);
  startTimer();
}

function startTimer() {
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    timerSeconds--;
    let m = Math.floor(timerSeconds / 60);
    let s = timerSeconds % 60;
    document.getElementById('timerText').innerText = `⏱️ ${m}:${s < 10 ? '0' : ''}${s}`;
    if (timerSeconds <= 0) {
      clearInterval(timerInterval);
      finishQuiz();
    }
  }, 1000);
}

function showQuestion(idx) {
  const q = quizData[idx];
  document.getElementById('chapterTitle').innerText = q.chapter;
  document.getElementById('qChapter').innerText = `${q.chapter} • ${q.topic}`;
  document.getElementById('qText').innerText = `Q${idx + 1}. ${q.question}`;
  
  const progressPct = ((idx + 1) / quizData.length) * 100;
  document.getElementById('progressBar').style.width = `${progressPct}%`;
  
  const grid = document.getElementById('optionsGrid');
  grid.innerHTML = '';
  
  const expBox = document.getElementById('explanationBox');
  expBox.style.display = 'none';

  q.options.forEach((optText, i) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.innerHTML = `<span><strong>${String.fromCharCode(65 + i)}.</strong> ${optText}</span>`;
    
    if (userAnswers[idx] !== null) {
      btn.disabled = true;
      if (i === q.answer) btn.classList.add('correct');
      if (userAnswers[idx] === i && i !== q.answer) btn.classList.add('incorrect');
    } else {
      btn.onclick = () => selectOption(idx, i);
    }
    grid.appendChild(btn);
  });

  if (userAnswers[idx] !== null) {
    expBox.style.display = 'block';
    expBox.innerHTML = `<strong>Explanation:</strong> ${q.explanation}`;
  }

  document.getElementById('prevBtn').disabled = (idx === 0);
  document.getElementById('nextBtn').innerText = (idx === quizData.length - 1) ? "Submit Quiz" : "Next";
}

function selectOption(qIdx, optIdx) {
  userAnswers[qIdx] = optIdx;
  if (optIdx === quizData[qIdx].answer) {
    score += 1;
  }
  document.getElementById('scoreText').innerText = `Score: ${score}`;
  showQuestion(qIdx);
}

function navigate(direction) {
  if (direction === 1 && currentIdx === quizData.length - 1) {
    finishQuiz();
    return;
  }
  currentIdx = Math.max(0, Math.min(quizData.length - 1, currentIdx + direction));
  showQuestion(currentIdx);
}

function finishQuiz() {
  clearInterval(timerInterval);
  document.getElementById('quizScreen').style.display = 'none';
  document.getElementById('resultsScreen').style.display = 'block';

  const total = quizData.length;
  let correctCount = 0;
  let weakTopics = new Set();

  quizData.forEach((q, i) => {
    if (userAnswers[i] === q.answer) {
      correctCount++;
    } else {
      weakTopics.add(`${q.chapter} - ${q.topic}`);
    }
  });

  const pct = Math.round((correctCount / total) * 100);
  document.getElementById('finalPercentage').innerText = `${pct}%`;
  document.getElementById('resTotal').innerText = total;
  document.getElementById('resCorrect').innerText = correctCount;
  document.getElementById('resIncorrect').innerText = total - correctCount;
  document.getElementById('resScore').innerText = `${correctCount}/${total}`;

  let grade = "";
  if (pct >= 85) grade = "🏆 Outstanding (PCS/UPSC Ready)";
  else if (pct >= 70) grade = "🌟 Very Good (Solid Conceptual Clarity)";
  else if (pct >= 50) grade = "👍 Good Effort (Needs Revision)";
  else grade = "📚 Keep Learning (Re-read NCERT Class 9 Textbook)";
  
  document.getElementById('gradeText').innerText = grade;

  const list = document.getElementById('weakTopicsList');
  list.innerHTML = "";
  if (weakTopics.size === 0) {
    list.innerHTML = "<li>🎉 Excellent! No major weak areas identified.</li>";
  } else {
    Array.from(weakTopics).slice(0, 8).forEach(topic => {
      const li = document.createElement('li');
      li.innerText = topic;
      list.appendChild(li);
    });
  }
}

function shareQuiz() {
  const text = `I just completed the NCERT Geography Class 9 Master Challenge! Take the quiz and test your concepts.`;
  if (navigator.share) {
    navigator.share({ title: 'NCERT Geography Quiz', text: text, url: window.location.href });
  } else {
    navigator.clipboard.writeText(`${text} ${window.location.href}`);
    alert("Quiz link copied to clipboard! Share it with your friends on WhatsApp.");
  }
}

// Keyboard Controls: 1-4 for options, Left/Right Arrows for Navigation
document.addEventListener('keydown', (e) => {
  if (document.getElementById('quizScreen').style.display === 'none') return;
  if (e.key === 'ArrowRight') navigate(1);
  if (e.key === 'ArrowLeft') navigate(-1);
  if (['1','2','3','4'].includes(e.key) && userAnswers[currentIdx] === null) {
    selectOption(currentIdx, parseInt(e.key) - 1);
  }
});

// Start application
initQuiz();
</script>
